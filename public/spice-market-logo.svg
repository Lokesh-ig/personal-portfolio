<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spiceBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="spiceBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Chili Gradient -->
    <linearGradient id="chiliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#spiceBgGrad)" stroke="url(#spiceBorderGrad)" stroke-width="3" />

  <!-- Chili Stem -->
  <path d="M56 22 C58 28 54 32 48 35" fill="none" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" />
  <path d="M44 32 C46 34 50 34 52 32" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Chili Pepper Body -->
  <path d="M48 34 C64 38 68 54 58 68 C50 78 40 82 32 82 C30 82 29 80 30 78 C35 72 40 64 42 54 C44 44 44 36 48 34 Z" fill="url(#chiliGrad)" stroke="#ef4444" stroke-width="1.5" />

  <!-- Highlight Sparkle -->
  <path d="M70 28 L72 34 L78 36 L72 38 L70 44 L68 38 L62 36 L68 34 Z" fill="#00d2ff" />
</svg>
